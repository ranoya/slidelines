<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahn</title>
    <script src="https://datat.vercel.app/basicsmin.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap");

      * {
        margin: 0;
        padding: 0;
        border: 0;
      }

      #overlap {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: none;
      }

      #wrap {
        padding-top: 30px;
        padding-left: 30px;
        padding-bottom: 20px;
        padding-right: 40px;
        display: flex;
        gap: 60px;
        width: calc(100% - 70px);
        height: calc(100dvh - 50px);
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: flex-start;
        justify-content: flex-start;
        align-items: flex-start;
        overflow-y: hidden;
        /* background-size: 14px 14px;
        background-color: #f0f0f0; */
        /* background: radial-gradient(
            circle at 1px 1px,
            rgba(0, 0, 0, 0.35) 1px,
            transparent 0px
          )
          0% 0% / 20px 20px rgb(255, 255, 255); */

        /* background-image: repeating-linear-gradient(
          45deg,
          #adadad 0,
          #383838 0.4px,
          #fffef5 0,
          #fffef5 25%
        ); */

        background-size: 2px 2px;
        background-image: repeating-linear-gradient(
          0deg,
          rgb(215, 215, 215),
          rgb(215, 215, 215) 0.6px,
          rgb(244, 244, 244) 0.6px,
          rgb(244, 244, 244)
        );
      }

      #wrap::-webkit-scrollbar {
        height: 12px;
        background-size: 4px 4px;
        background-color: #f0f0f0;

        background-image: repeating-linear-gradient(
          45deg,
          #adadad 0,
          #383838 0.4px,
          #fffef5 0,
          #fffef5 25%
        );
      }

      #wrap::-webkit-scrollbar-thumb {
        background-color: #999999;
      }

      #wrap iframe {
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        flex-shrink: 0;

        max-height: calc(100dvh - 160px);
        height: calc(100dvh - 160px);

        overflow-y: auto;
        overflow-x: hidden;
      }

      .nolabel {
        max-height: calc(100dvh - 70px) !important;
        height: calc(100dvh - 70px) !important;
      }

      h1 {
        margin-bottom: 70px;
        text-align: right;
        background-image: none;
        margin-top: -10px;
        font-size: 5.9rem;
        line-height: 4rem;

        font-size: 4.5rem;
        line-height: 2rem;

        font-weight: 400;
        color: #580909;
        font-family: "Covered By Your Grace", cursive;
        font-weight: 400;
        transform-origin: right bottom;
        transform: rotate(-2.5deg);
        font-style: normal !important;
        background-position: right bottom;
        transition: 0.4s ease-in;
      }

      h1 .marker {
        color: #580909;
        margin-top: 10rem;
        font-family: "Covered By Your Grace", cursive;
        font-style: normal !important;
        box-shadow: inset 0px min(-5rem, -100px) #ff464682;
        padding-left: 30px;
      }
    </style>
  </head>

  <body>
    <div id="overlap"></div>

    <div id="wrap"></div>
  </body>

  <script>
    $_GET = [];
    (function () {
      corte = window.location.href.toString().indexOf("?");
      if (corte > 0) {
        argumento = window.location.href.toString().substring(corte + 1);
        argumentos = argumento.split("&");
        for (arg in argumentos) {
          let argCorte = argumentos[arg].indexOf("=");
          $_GET[argumentos[arg].substring(0, argCorte)] = argumentos[
            arg
          ].substring(argCorte + 1);
        }
      }
    })();

    let distribui = function (arr) {
      console.table(arr);

      let code = "";
      let Aspect = "";
      let Size = "";
      let estilo = "";

      for (let i = 0; i < arr.length; i++) {
        Aspect = "";
        Size = "100%";
        estilo = "";

        if (
          typeof arr[i].Aspect != "undefined" &&
          arr[i].Aspect != "" &&
          arr[i].Aspect != null
        ) {
          Aspect = arr[i].Aspect;
        }

        if (
          typeof arr[i].Size != "undefined" &&
          arr[i].Size != "" &&
          arr[i].Size != null
        ) {
          Size = arr[i].Size;
        }

        if (Size != "") {
          estilo = `width: ${Size}; `;
        }

        if (Aspect != "") {
          estilo += `aspect-ratio: ${Aspect}; height: unset !important;`;
        }

        if (
          typeof arr[i].Decor != "undefined" &&
          arr[i].Decor != "" &&
          arr[i].Decor != null
        ) {
          estilo += ` box-shadow: unset;`;
        }

        if (
          typeof $_GET["awry"] != "undefined" &&
          $_GET["awry"] != "" &&
          $_GET["awry"] != null
        ) {
          let torto = Math.random() - 0.5;
          estilo += ` transform: rotate(${torto}deg);`;
        }

        if (
          typeof $_GET["nolabel"] != "undefined" &&
          $_GET["nolabel"] != "" &&
          $_GET["nolabel"] != null
        ) {
          code += `
        <div>
          <iframe class="nolabel" frameborder="0" src="${arr[i].Link}" style="${estilo}"></iframe>
        </div>`;
        } else {
          code += `
        <div>
        <h1 id="mtitulo"><span class="marker">${arr[i].Label}</span></h1>
        
        <iframe frameborder="0" src="${arr[i].Link}" style="${estilo}"></iframe>
        </div>`;
        }
      }

      document.getElementById("wrap").innerHTML = code;
    };

    let datadefault =
      "https://docs.google.com/spreadsheets/d/1Hja-7ozKTpcfhVX9sc3FkDH-NLj_RXllFIDTO8EIFV0/edit?gid=538306670#gid=538306670";

    if (
      typeof $_GET["materiais"] != "undefined" &&
      $_GET["materiais"] != "" &&
      $_GET["materiais"] != null
    ) {
      datadefault = decodeURIComponent($_GET["materiais"]);
    }

    gsdata(datadefault, distribui);
  </script>
</html>
