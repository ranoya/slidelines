<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        background-color: transparent;
      }

      #imagem {
        width: 100%;
        height: 100vh;
        background-size: contain;
        background-position: center center;
      }
    </style>
  </head>
  <body>
    <div id="imagem"></div>
  </body>

  <script>
    $_GET = [];
    (function () {
      corte = window.location.href.toString().indexOf("?");
      if (corte > 0) {
        argumento = window.location.href.toString().substring(corte + 1);
        argumentos = argumento.split("&");
        for (arg in argumentos) {
          let argCorte = argumentos[arg].indexOf("=");
          $_GET[argumentos[arg].substring(0, argCorte)] = argumentos[
            arg
          ].substring(argCorte + 1);
        }
      }
    })();

    document.getElementById("imagem").style.backgroundImage =
      "url('" + $_GET["file"] + "')";
  </script>
</html>
